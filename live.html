<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <link rel="icon" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <title>直播入口 - 鑫艺影像馆</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: #09090b;
            color: #f2f2f2;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(12px);
            z-index: 100;
            padding: 1rem max(5%, env(safe-area-inset-left)) 1rem max(5%, env(safe-area-inset-right));
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(229, 9, 20, 0.25);
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 0;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            flex: 0 0 40px;
            display: block;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.35);
            object-fit: contain;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .logo-brand {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #e50914 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
        }

        .logo-tagline {
            font-size: 0.7rem;
            color: #a3a3a3;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1rem;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.16);
            color: #fff;
            background: rgba(255,255,255,0.06);
            text-decoration: none;
            transition: all 0.2s;
        }

        .nav-link:hover {
            background: rgba(255,255,255,0.14);
            transform: translateY(-1px);
        }

        main {
            margin-top: 88px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
            padding: clamp(1rem, 2.4vw, 2rem) 5% 2.5rem;
        }

        .player-section {
            display: grid;
            grid-template-columns: minmax(0, 2.1fr) minmax(300px, 0.9fr);
            gap: 1.5rem;
            align-items: start;
        }

        .player-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            min-width: 0;
            touch-action: manipulation;
        }

        .player-card.controls-visible .player-actions {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .video-wrapper {
            position: relative;
            background: #000;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            min-height: 220px;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .live-window-badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            width: 0.82rem;
            height: 0.82rem;
            border-radius: 50%;
            background: #e50914;
            box-shadow: 0 0 0 4px rgba(229,9,20,0.2), 0 0 18px rgba(229,9,20,0.9);
        }

        .player-status {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
        }

        .player-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem;
            gap: 0.7rem;
            flex-wrap: wrap;
            background: rgba(12,12,14,0.96);
            border-top: 1px solid rgba(255,255,255,0.1);
            opacity: 0;
            transform: translateY(10px);
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .player-actions .btn-secondary,
        .player-actions .btn-secondary:hover {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            color: #fff;
        }

        .volume-control {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            min-width: 150px;
            height: 46px;
            padding: 0 0.7rem;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            color: #fff;
        }

        .volume-control svg {
            width: 20px;
            height: 20px;
            flex: 0 0 20px;
            fill: currentColor;
            stroke: currentColor;
        }

        .volume-control input[type="range"] {
            width: 100%;
            accent-color: #e50914;
            cursor: pointer;
        }

        .btn-secondary {
            width: 46px;
            height: 46px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 0;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
            min-height: 46px;
        }

        .btn-secondary:hover {
            transform: translateY(-1px);
        }

        .btn-secondary:disabled {
            cursor: not-allowed;
            opacity: 0.5;
            transform: none;
        }

        .btn-secondary.primary-action {
            background: #e50914;
            border-color: #e50914;
            color: #fff;
        }

        .btn-secondary.active {
            color: #ff4d57;
            border-color: rgba(229,9,20,0.55);
            background: rgba(229,9,20,0.12);
        }

        .btn-secondary svg {
            width: 22px;
            height: 22px;
            display: block;
            fill: currentColor;
            stroke: currentColor;
        }

        .player-card:fullscreen {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            border: 0;
            border-radius: 0;
            background: #000;
        }

        .player-card:fullscreen .video-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            aspect-ratio: auto;
        }

        .player-card:fullscreen .player-actions {
            flex: 0 0 auto;
        }

        .live-side {
            display: grid;
            gap: 1rem;
            min-width: 0;
            position: sticky;
            top: 104px;
        }

        .channel-list {
            display: grid;
            gap: 1rem;
        }

        .channel-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 1.2rem;
            transition: all 0.2s;
            cursor: pointer;
        }

        .channel-card:hover,
        .channel-card.active {
            border-color: #e50914;
            background: rgba(229,9,20,0.12);
        }

        .channel-card h3 {
            margin-bottom: 0.6rem;
            font-size: 1rem;
        }

        .channel-card p {
            color: #c0c0c8;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .schedule {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 1.5rem;
        }

        .schedule h3 {
            margin-bottom: 1rem;
        }

        .schedule-item {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.9rem;
            color: #d0d0d8;
            font-size: 0.95rem;
        }

        .schedule-item:last-child {
            margin-bottom: 0;
        }

        .schedule-item span:first-child {
            color: #fff;
            min-width: 90px;
            font-weight: 600;
        }

        .live-detail {
            display: grid;
            grid-template-columns: minmax(0, 1.4fr) minmax(300px, 0.6fr);
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .detail-panel,
        .comments-panel,
        .manage-panel {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 1.5rem;
        }

        .detail-heading,
        .panel-heading,
        .form-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .detail-heading h1 {
            font-size: clamp(1.45rem, 3vw, 2.3rem);
        }

        .detail-description {
            color: #c0c0c8;
            line-height: 1.75;
            margin-bottom: 1rem;
        }

        .live-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            color: #a8a8b2;
            font-size: 0.85rem;
        }

        .live-meta span,
        .live-status-pill {
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 999px;
            padding: 0.35rem 0.65rem;
        }

        .live-status-pill {
            color: #ff6870;
            border-color: rgba(229,9,20,0.45);
            white-space: nowrap;
        }

        .comments-list {
            display: grid;
            gap: 0.9rem;
            max-height: 360px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }

        .comment-item {
            padding-bottom: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .comment-item:last-child {
            border-bottom: 0;
            padding-bottom: 0;
        }

        .comment-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .comment-author {
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .comment-time {
            color: #777782;
            font-size: 0.75rem;
            margin-left: 0.5rem;
        }

        .comment-delete-btn {
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.06);
            color: #ffb3b8;
            border-radius: 999px;
            padding: 0.25rem 0.65rem;
            font-size: 0.76rem;
            cursor: pointer;
        }

        .comment-delete-btn:hover {
            background: rgba(255,255,255,0.12);
        }

        .comment-text {
            color: #c8c8d0;
            line-height: 1.55;
            margin-top: 0.35rem;
            overflow-wrap: anywhere;
        }

        .comment-form,
        .live-form {
            display: grid;
            gap: 0.75rem;
        }

        .comment-form-row,
        .form-actions {
            display: flex;
            gap: 0.65rem;
            align-items: center;
        }

        .live-input,
        .live-textarea {
            width: 100%;
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 12px;
            background: rgba(0,0,0,0.24);
            color: #fff;
            padding: 0.75rem 0.85rem;
            font: inherit;
            outline: none;
        }

        .live-input:focus,
        .live-textarea:focus {
            border-color: rgba(229,9,20,0.72);
        }

        .live-textarea {
            min-height: 84px;
            resize: vertical;
        }

        .manage-panel {
            margin-top: 1.5rem;
        }

        .manage-panel[hidden] {
            display: none;
        }

        .live-form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.8rem;
        }

        .live-form-grid .full-width {
            grid-column: 1 / -1;
        }

        .form-actions {
            justify-content: flex-end;
        }

        .live-button {
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 10px;
            background: rgba(255,255,255,0.08);
            color: #fff;
            padding: 0.65rem 0.9rem;
            cursor: pointer;
            font: inherit;
        }

        .live-button:hover {
            background: rgba(255,255,255,0.16);
        }

        .live-button.primary {
            background: #e50914;
            border-color: #e50914;
        }

        .channel-card .card-actions {
            display: flex;
            gap: 0.45rem;
            margin-top: 0.9rem;
        }

        .card-action {
            background: transparent;
            border: 0;
            color: #a8a8b2;
            cursor: pointer;
            padding: 0;
            font: inherit;
            font-size: 0.8rem;
        }

        .card-action:hover {
            color: #fff;
        }

        @media (max-width: 980px) {
            .player-section {
                grid-template-columns: 1fr;
            }

            .live-detail {
                grid-template-columns: 1fr;
            }

            .live-side {
                position: static;
            }
        }

        @media (max-width: 680px) {
            .navbar {
                padding: 0.75rem 1rem;
                gap: 0.75rem;
            }
            .navbar > div:last-child {
                display: flex;
                gap: 0.45rem;
                flex: 0 0 auto;
            }
            main {
                margin-top: 74px;
                padding: 0.9rem max(0.9rem, env(safe-area-inset-right)) calc(1.75rem + env(safe-area-inset-bottom)) max(0.9rem, env(safe-area-inset-left));
            }
            .logo-brand {
                font-size: 1.2rem;
            }
            .logo {
                flex: 1 1 auto;
                min-width: 0;
            }
            .logo-icon {
                width: 36px;
                height: 36px;
                flex-basis: 36px;
            }
            .logo-tagline {
                display: none;
            }
            .nav-link {
                min-height: 40px;
                padding: 0.55rem 0.68rem;
                font-size: 0.82rem;
                white-space: nowrap;
            }
            .player-card,
            .schedule,
            .detail-panel,
            .comments-panel,
            .manage-panel {
                border-radius: 18px;
            }

            .live-form-grid {
                grid-template-columns: 1fr;
            }
            .video-wrapper {
                aspect-ratio: 16 / 9;
                min-height: 0;
            }
            .live-window-badge {
                top: 0.75rem;
                left: 0.75rem;
                width: 0.72rem;
                height: 0.72rem;
            }
            .player-actions {
                display: grid;
                grid-template-columns: repeat(4, minmax(42px, 1fr));
                padding: 0.65rem;
                gap: 0.55rem;
                opacity: 1;
                transform: none;
                pointer-events: auto;
            }
            .btn-secondary {
                width: 100%;
                height: 42px;
                min-height: 42px;
                border-radius: 11px;
            }

            .volume-control {
                grid-column: 1 / -1;
                width: 100%;
                min-width: 0;
                height: 42px;
            }
            .btn-secondary svg {
                width: 20px;
                height: 20px;
            }
            .channel-list {
                display: flex;
                gap: 0.75rem;
                margin-inline: -0.9rem;
                padding: 0 0.9rem 0.2rem;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
            }
            .channel-card {
                flex: 0 0 min(82%, 320px);
                scroll-snap-align: start;
                padding: 1rem;
            }
            .schedule {
                padding: 1.2rem;
            }
            .schedule-item {
                display: grid;
                grid-template-columns: 4rem 1fr;
                gap: 0.35rem 0.75rem;
            }
            .schedule-item span:last-child {
                grid-column: 2;
                color: #a8a8b2;
            }
        }

        @media (min-width: 981px) {
            .player-card {
                min-height: calc(100vh - 148px);
            }
        }

        @media (max-width: 420px) {
            .logo-brand {
                font-size: 1.05rem;
            }
            .nav-link[href="favorites.html"] {
                display: none;
            }
            .player-actions {
                grid-template-columns: repeat(4, minmax(40px, 1fr));
                gap: 0.45rem;
            }
            .btn-secondary {
                height: 40px;
                min-height: 40px;
            }
        }

        @media (orientation: landscape) and (max-height: 520px) {
            .navbar {
                position: static;
            }
            main {
                margin-top: 0;
            }
            .player-section {
                grid-template-columns: minmax(0, 1fr) 280px;
            }
            .live-side {
                max-height: calc(100dvh - 1.8rem);
                overflow-y: auto;
            }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="logo" onclick="window.location.href='index.html'">
        <img class="logo-icon" src="logo.png" alt="鑫艺影像馆 logo">
        <div class="logo-text">
            <div class="logo-brand">鑫艺影像馆</div>
            <div class="logo-tagline">经典电影 · 自由分享</div>
        </div>
    </div>
	    <div>
	        <a class="nav-link" href="index.html">返回首页</a>
	        <a class="nav-link" href="favorites.html">我的收藏</a>
            <span class="auth-nav-status" id="authNavStatus"></span>
            <button class="nav-link" id="openRegisterModalBtn" type="button">会员注册</button>
            <button class="nav-link" id="logoutBtn" type="button" hidden>退出登录</button>
            <button class="nav-link" id="manageLiveBtn" type="button">管理直播</button>
	    </div>
</nav>
<div class="auth-modal" id="registerModal" hidden>
    <div class="auth-card">
        <div class="auth-header">
            <h2>会员注册</h2>
            <button class="auth-close" id="closeRegisterModalBtn" type="button" aria-label="关闭">×</button>
        </div>
        <div class="auth-tabs">
            <button class="auth-tab active" id="loginTab" type="button">登录</button>
            <button class="auth-tab" id="registerTab" type="button">注册</button>
        </div>
        <form class="auth-form" id="loginForm" hidden>
            <label>
                用户名
                <input id="loginUsername" type="text" maxlength="20" placeholder="请输入用户名" required>
            </label>
            <label>
                密码
                <input id="loginPassword" type="password" maxlength="40" placeholder="请输入密码" required>
            </label>
            <button class="auth-submit" type="submit">登录</button>
        </form>
        <form class="auth-form" id="registerForm">
            <label>
                用户名
                <input id="registerUsername" type="text" maxlength="20" placeholder="请输入用户名" required>
            </label>
            <label>
                密码
                <input id="registerPassword" type="password" maxlength="40" placeholder="请输入密码" required>
            </label>
            <button class="auth-submit" type="submit">注册会员</button>
        </form>
        <div class="auth-status" id="authStatus"></div>
        <div class="auth-tip">说明：现在使用后端接口保存会员账号，登录后会在当前浏览器保持会话。</div>
    </div>
</div>
<main>
    <section class="player-section" aria-label="直播影片">
        <div class="player-card">
            <div class="video-wrapper">
                <video
                    id="livePlayer"
                    playsinline
                    webkit-playsinline
                    x5-playsinline
                    x5-video-player-type="h5"
                    x5-video-player-fullscreen="true"
                    preload="metadata"
                    crossorigin="anonymous"
                ></video>
                <div class="live-window-badge" aria-label="直播中"></div>
                <div class="player-status" id="liveStatus" aria-live="polite"></div>
            </div>
            <div class="player-actions" aria-label="直播控制">
                <button class="btn-secondary primary-action" id="playBtn" type="button" aria-label="播放" title="播放">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M8 5.5v13l10-6.5-10-6.5z"></path>
                    </svg>
                </button>
                <button class="btn-secondary" id="pauseBtn" type="button" aria-label="暂停" title="暂停">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M7 5h4v14H7zM13 5h4v14h-4z"></path>
                    </svg>
                </button>
                <button class="btn-secondary" id="forwardBtn" type="button" aria-label="快进 10 秒" title="快进 10 秒">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M13 7v10l7-5-7-5zM4 7v10l7-5-7-5z"></path>
                    </svg>
                </button>
                <button class="btn-secondary" id="rewindBtn" type="button" aria-label="快退 10 秒" title="快退 10 秒">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M11 7v10l-7-5 7-5zM20 7v10l-7-5 7-5z"></path>
                    </svg>
                </button>
                <button class="btn-secondary" id="refreshBtn" type="button" aria-label="刷新流" title="刷新流">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.34-5.66"></path>
                        <path d="M20 4v6h-6z"></path>
                    </svg>
                </button>
                <button class="btn-secondary" id="joinBtn" type="button" aria-label="加入直播" title="加入直播">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="none" stroke-width="2" stroke-linecap="round" d="M6.2 7.8a7 7 0 0 0 0 8.4M17.8 7.8a7 7 0 0 1 0 8.4"></path>
                        <circle cx="12" cy="12" r="3.2"></circle>
                    </svg>
                </button>
                <button class="btn-secondary" id="fullscreenBtn" type="button" aria-label="全屏" title="全屏">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M8 4H4v4M16 4h4v4M20 16v4h-4M4 16v4h4"></path>
                    </svg>
                </button>
                <button class="btn-secondary" id="favoriteBtn" type="button" aria-label="收藏频道" title="收藏频道">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="none" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" d="M12 20s-7-4.35-9-9.2C1.8 7.85 3.7 5 6.8 5c1.8 0 3.1 1 3.9 2.1C11.5 6 12.8 5 14.6 5c3.1 0 5 2.85 3.8 5.8C16.4 15.65 12 20 12 20z"></path>
                    </svg>
                </button>
                <label class="volume-control" for="volumeSlider" title="调节音量">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 9v6h4l5 4V5L8 9H4z"></path>
                        <path fill="none" stroke-width="2" stroke-linecap="round" d="M16 9.5a4 4 0 0 1 0 5M18.5 7a7.5 7.5 0 0 1 0 10"></path>
                    </svg>
                    <input id="volumeSlider" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量">
                </label>
            </div>
        </div>
        <div class="live-side">
            <div class="channel-list" id="channelList"></div>
            <div class="schedule">
                <h3>直播节目表</h3>
                <div id="scheduleList"></div>
            </div>
        </div>
    </section>

    <section class="live-detail" aria-label="直播详情与评论">
        <article class="detail-panel">
            <div class="detail-heading">
                <h1 id="liveTitle">直播详情</h1>
                <span class="live-status-pill">直播中</span>
            </div>
            <p class="detail-description" id="liveDescription"></p>
            <div class="live-meta" id="liveMeta"></div>
        </article>
        <aside class="comments-panel">
            <div class="panel-heading">
                <h2>直播评论</h2>
                <span id="commentCount">0 条</span>
            </div>
            <div class="comments-list" id="commentsList"></div>
            <form class="comment-form" id="commentForm">
                <div class="comment-form-row">
                    <input class="live-input" id="commentAuthor" maxlength="20" placeholder="昵称" required>
                    <button class="live-button primary" type="submit">发送</button>
                </div>
                <textarea class="live-textarea" id="commentText" maxlength="240" placeholder="说点什么..." required></textarea>
            </form>
        </aside>
    </section>

    <section class="manage-panel" id="managePanel" hidden>
        <div class="member-only-hint" id="memberOnlyHint">仅登录会员可管理直播。</div>
        <div class="form-heading">
            <h2 id="formTitle">发布直播</h2>
            <button class="live-button" id="manageToggleBtn" type="button">收起</button>
        </div>
        <form class="live-form" id="liveForm">
            <div class="live-form-grid">
                <input class="live-input" id="liveName" maxlength="40" placeholder="直播名称" required>
                <input class="live-input" id="liveDescriptionInput" maxlength="120" placeholder="直播简介" required>
                <input class="live-input" id="liveStream" type="url" placeholder="主直播地址（m3u8 或 mp4）" required>
                <input class="live-input" id="liveFallback" type="url" placeholder="备用直播地址（可选）">
                <input class="live-input full-width" id="liveProgram" maxlength="60" placeholder="节目名称（可选）">
            </div>
            <div class="form-actions">
                <button class="live-button" id="cancelEditBtn" type="button" hidden>取消编辑</button>
                <button class="live-button primary" type="submit">保存直播</button>
            </div>
        </form>
    </section>

</main>
<script src="player.js?v=20260531-decode-fix"></script>
<script src="member-register.js"></script>
<script>
    const defaultLiveChannels = [
        {
            id: 1,
            name: '经典电影频道',
            description: '经典电影实时播放',
            stream: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',
            fallbackStream: 'https://test-streams.mux.dev/pts_shift/master.m3u8',
            program: '经典电影巡礼'
        },
        {
            id: 2,
            name: '艺术大片频道',
            description: '沉浸式艺术影片实时连播',
            stream: 'https://test-streams.mux.dev/pts_shift/master.m3u8',
            fallbackStream: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',
            program: '艺术影像展映'
        },
        {
            id: 3,
            name: '纪录片频道',
            description: '纪录片夜间直播',
            stream: 'https://test-streams.mux.dev/4v3p6f8w/master.m3u8',
            fallbackStream: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8',
            program: '纪录片夜聊'
        }
    ];

    function readStorage(key, fallback) {
        try {
            const value = JSON.parse(localStorage.getItem(key));
            return value && typeof value === 'object' ? value : fallback;
        } catch (error) {
            return fallback;
        }
    }

    let liveChannels = readStorage('liveChannels', defaultLiveChannels);
    if (!Array.isArray(liveChannels) || !liveChannels.length) liveChannels = defaultLiveChannels;

    const programSchedule = [
        { time: '20:00', title: '经典电影巡礼', channel: '经典电影频道' },
        { time: '21:30', title: '艺术影像展映', channel: '艺术大片频道' },
        { time: '23:00', title: '纪录片夜聊', channel: '纪录片频道' }
    ];

    const video = document.getElementById('livePlayer');
    const liveStatus = document.getElementById('liveStatus');
    const channelList = document.getElementById('channelList');
    const scheduleList = document.getElementById('scheduleList');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const rewindBtn = document.getElementById('rewindBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const joinBtn = document.getElementById('joinBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const favoriteBtn = document.getElementById('favoriteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const playerCard = document.querySelector('.player-card');
    const liveTitle = document.getElementById('liveTitle');
    const liveDescription = document.getElementById('liveDescription');
    const liveMeta = document.getElementById('liveMeta');
    const commentsList = document.getElementById('commentsList');
    const commentCount = document.getElementById('commentCount');
    const commentForm = document.getElementById('commentForm');
    const manageLiveBtn = document.getElementById('manageLiveBtn');
    const managePanel = document.getElementById('managePanel');
    const memberOnlyHint = document.getElementById('memberOnlyHint');
    const manageToggleBtn = document.getElementById('manageToggleBtn');
    const liveForm = document.getElementById('liveForm');
    const formTitle = document.getElementById('formTitle');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const liveName = document.getElementById('liveName');
    const liveDescriptionInput = document.getElementById('liveDescriptionInput');
    const liveStream = document.getElementById('liveStream');
    const liveFallback = document.getElementById('liveFallback');
    const liveProgram = document.getElementById('liveProgram');

    let streamPlayer = null;
    let activeChannel = liveChannels[0];
    let editingChannelId = null;
    let controlsTimer = null;
    const isTouchDevice = window.matchMedia('(hover: none), (pointer: coarse)').matches;

    function setVolume(value) {
        const volume = Math.max(0, Math.min(1, Number(value)));
        video.volume = volume;
        video.muted = volume === 0;
        volumeSlider.value = String(volume);
        volumeSlider.setAttribute('aria-valuetext', `${Math.round(volume * 100)}%`);
        localStorage.setItem('liveVolume', String(volume));
    }

    function renderChannels() {
        channelList.innerHTML = liveChannels.map(channel => `
            <div class="channel-card" data-id="${channel.id}">
                <h3>${channel.name}</h3>
                <p>${channel.description}</p>
                <div class="card-actions">
                    <button class="card-action" data-action="edit" type="button">编辑</button>
                    <button class="card-action" data-action="delete" type="button">删除</button>
                </div>
            </div>
        `).join('');

        document.querySelectorAll('.channel-card').forEach(card => {
            card.addEventListener('click', event => {
                if (event.target.closest('.card-action')) return;
                const id = Number(card.getAttribute('data-id'));
                const channel = liveChannels.find(item => item.id === id);
                if (channel) {
                    selectChannel(channel);
                }
            });
            card.querySelectorAll('.card-action').forEach(action => {
                action.addEventListener('click', event => {
                    event.stopPropagation();
                    const id = Number(card.getAttribute('data-id'));
                    if (action.dataset.action === 'edit') startEdit(id);
                    if (action.dataset.action === 'delete') deleteChannel(id);
                });
            });
        });
    }

    function saveChannels() {
        localStorage.setItem('liveChannels', JSON.stringify(liveChannels));
    }

    function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>'"]/g, character => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[character]));
    }

    function getComments() {
        return readStorage('liveComments', {});
    }

    function getCommentId(comment) {
        return comment?.id || `${comment?.time || Date.now()}-${comment?.author || '访客'}-${comment?.text || ''}`;
    }

    function deleteLiveComment(channelId, commentId) {
        const comments = getComments();
        const channelComments = (comments[channelId] || []).filter(comment => getCommentId(comment) !== commentId);
        comments[channelId] = channelComments;
        localStorage.setItem('liveComments', JSON.stringify(comments));
        renderComments();
    }

    function renderDetails() {
        liveTitle.textContent = activeChannel.name;
        liveDescription.textContent = activeChannel.description;
        liveMeta.innerHTML = [
            `节目：${escapeHTML(activeChannel.program || '自由直播')}`,
            `频道 ID：${activeChannel.id}`,
            '评论实时更新'
        ].map(item => `<span>${item}</span>`).join('');
    }

    function renderComments() {
        const comments = getComments()[activeChannel.id] || [];
        commentCount.textContent = `${comments.length} 条`;
        commentsList.innerHTML = comments.length ? comments.map(comment => `
            <div class="comment-item">
                <div class="comment-header">
                    <div>
                        <span class="comment-author">${escapeHTML(comment.author)}</span>
                        <span class="comment-time">${escapeHTML(comment.time)}</span>
                    </div>
                    <button class="comment-delete-btn" type="button" data-comment-id="${escapeHTML(getCommentId(comment))}">删除</button>
                </div>
                <div class="comment-text">${escapeHTML(comment.text)}</div>
            </div>
        `).join('') : '<p class="comment-text">还没有评论，来做第一个发言的人吧。</p>';
    }

    function toggleManagePanel(show) {
        const token = localStorage.getItem('memberAuthToken');
        if (!token) {
            if (memberOnlyHint) memberOnlyHint.textContent = '请先登录会员后再管理直播。';
            managePanel.hidden = false;
            managePanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
            return;
        }
        if (memberOnlyHint) memberOnlyHint.textContent = '仅登录会员可管理直播。';
        managePanel.hidden = !show;
        if (show) managePanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function resetLiveForm() {
        editingChannelId = null;
        formTitle.textContent = '发布直播';
        cancelEditBtn.hidden = true;
        liveForm.reset();
    }

    function startEdit(id) {
        const channel = liveChannels.find(item => item.id === id);
        if (!channel) return;
        editingChannelId = id;
        formTitle.textContent = '编辑直播';
        cancelEditBtn.hidden = false;
        liveName.value = channel.name;
        liveDescriptionInput.value = channel.description;
        liveStream.value = channel.stream;
        liveFallback.value = channel.fallbackStream || '';
        liveProgram.value = channel.program || '';
        toggleManagePanel(true);
    }

    function deleteChannel(id) {
        const channel = liveChannels.find(item => item.id === id);
        if (!channel || !window.confirm(`确定删除“${channel.name}”吗？`)) return;
        liveChannels = liveChannels.filter(item => item.id !== id);
        saveChannels();
        if (activeChannel.id === id) activeChannel = liveChannels[0];
        renderChannels();
        if (activeChannel) selectChannel(activeChannel);
        else setLiveStatus('暂无直播，请先发布一个直播');
        resetLiveForm();
    }

    function renderSchedule() {
        scheduleList.innerHTML = programSchedule.map(item => `
            <div class="schedule-item">
                <span>${item.time}</span>
                <span>${item.title}</span>
                <span>${item.channel}</span>
            </div>
        `).join('');
    }

    function setupPlayer() {
        streamPlayer = new StreamPlayer(video, {
            autoplay: false,
            hlsConfig: {
                maxLoadingDelay: 4,
                maxAutoBitrate: 8000000,
                minAutoBitrate: 0,
                startLevel: -1
            }
        });

        streamPlayer.on('loading', () => setLiveStatus('正在连接直播源...'));
        streamPlayer.on('buffering', () => setLiveStatus('缓冲中...'));
        streamPlayer.on('buffered', () => setLiveStatus('直播流已就绪'));
        streamPlayer.on('play', () => {
            setLiveStatus('正在播放');
            updateControlState();
        });
        streamPlayer.on('pause', () => {
            setLiveStatus('已暂停');
            updateControlState();
        });
        streamPlayer.on('error', () => setLiveStatus('直播源异常，已尝试备用源，请稍候...'));
        streamPlayer.on('qualitychange', data => {
            setLiveStatus(`已切换至 ${data.height || '自动'} 画质`);
        });
    }

    function setLiveStatus(text) {
        liveStatus.textContent = text;
    }

    function updateControlState() {
        playBtn.disabled = !video.paused;
        pauseBtn.disabled = video.paused;
        const canSeek = canSeekLive();
        forwardBtn.disabled = !canSeek;
        rewindBtn.disabled = !canSeek;
    }

    function playLive(statusText = '正在播放') {
        if (!streamPlayer) return;
        streamPlayer.play()
            .then(() => setLiveStatus(statusText))
            .catch(() => setLiveStatus('请点击播放以继续直播'));
    }

    function canSeekLive() {
        return video.seekable && video.seekable.length > 0 && Number.isFinite(video.currentTime);
    }

    function seekLive(seconds) {
        if (!canSeekLive()) {
            setLiveStatus('当前直播流不支持快进快退');
            updateControlState();
            return;
        }

        const seekableStart = video.seekable.start(0);
        const seekableEnd = video.seekable.end(video.seekable.length - 1);
        video.currentTime = Math.max(seekableStart, Math.min(seekableEnd, video.currentTime + seconds));
        setLiveStatus(seconds > 0 ? '已快进 10 秒' : '已快退 10 秒');
        updateControlState();
    }

    function joinLiveEdge() {
        if (canSeekLive()) {
            const liveEdge = video.seekable.end(video.seekable.length - 1);
            video.currentTime = Math.max(video.seekable.start(0), liveEdge - 2);
        }
        playLive('已加入直播，正在播放');
    }

    function getFavoriteChannels() {
        try {
            return JSON.parse(localStorage.getItem('favoriteLiveChannels') || '[]');
        } catch (error) {
            return [];
        }
    }

    function setFavoriteChannels(ids) {
        localStorage.setItem('favoriteLiveChannels', JSON.stringify(ids));
    }

    function updateFavoriteButton() {
        const favorites = getFavoriteChannels();
        const isFavorite = favorites.includes(activeChannel.id);
        favoriteBtn.classList.toggle('active', isFavorite);
        favoriteBtn.setAttribute('aria-label', isFavorite ? '取消收藏频道' : '收藏频道');
        favoriteBtn.setAttribute('title', isFavorite ? '取消收藏频道' : '收藏频道');
    }

    function toggleFavoriteChannel() {
        const favorites = getFavoriteChannels();
        const isFavorite = favorites.includes(activeChannel.id);
        const nextFavorites = isFavorite
            ? favorites.filter(id => id !== activeChannel.id)
            : [...favorites, activeChannel.id];
        setFavoriteChannels(nextFavorites);
        updateFavoriteButton();
        setLiveStatus(isFavorite ? '已取消收藏频道' : '已收藏频道');
    }

    function showControls() {
        playerCard.classList.add('controls-visible');
        window.clearTimeout(controlsTimer);
        if (isTouchDevice || video.paused) return;
        controlsTimer = window.setTimeout(() => {
            playerCard.classList.remove('controls-visible');
        }, 5000);
    }

    function setupControlAutoHide() {
        ['mousemove', 'touchstart', 'click', 'keydown'].forEach(eventName => {
            playerCard.addEventListener(eventName, showControls, { passive: true });
        });

        playerCard.addEventListener('focusin', showControls);
        playerCard.addEventListener('focusout', showControls);
        document.addEventListener('fullscreenchange', showControls);
        showControls();
    }

    function selectChannel(channel) {
        activeChannel = channel;
        document.querySelectorAll('.channel-card').forEach(card => {
            card.classList.toggle('active', Number(card.getAttribute('data-id')) === channel.id);
        });
        document.querySelector('.channel-card.active')?.scrollIntoView({
            behavior: 'smooth',
            block: 'nearest',
            inline: 'center'
        });
        updateFavoriteButton();
        renderDetails();
        renderComments();
        loadStream(channel.stream, channel.fallbackStream);
    }

    function loadStream(url, fallbackUrl = '') {
        if (!streamPlayer) return;
        streamPlayer.load(url, 'auto', fallbackUrl);
        setLiveStatus('直播源加载中...');
        updateControlState();
    }

    playBtn.addEventListener('click', () => {
        playLive('继续播放');
    });

    pauseBtn.addEventListener('click', () => {
        if (!streamPlayer) return;
        streamPlayer.pause();
        setLiveStatus('已暂停');
    });

    forwardBtn.addEventListener('click', () => {
        seekLive(10);
    });

    rewindBtn.addEventListener('click', () => {
        seekLive(-10);
    });

    refreshBtn.addEventListener('click', () => {
        setLiveStatus('正在刷新播放流...');
        loadStream(activeChannel.stream, activeChannel.fallbackStream);
    });

    joinBtn.addEventListener('click', () => {
        joinLiveEdge();
    });

    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            if (playerCard.requestFullscreen) {
                playerCard.requestFullscreen();
            } else if (video.webkitEnterFullscreen) {
                video.webkitEnterFullscreen();
            }
        } else {
            document.exitFullscreen?.();
        }
    });

    favoriteBtn.addEventListener('click', toggleFavoriteChannel);

    volumeSlider.addEventListener('input', event => {
        setVolume(event.target.value);
    });

    manageLiveBtn.addEventListener('click', () => {
        resetLiveForm();
        toggleManagePanel(true);
    });

    manageToggleBtn.addEventListener('click', () => toggleManagePanel(false));
    cancelEditBtn.addEventListener('click', resetLiveForm);

    liveForm.addEventListener('submit', event => {
        event.preventDefault();
        const wasEditing = Boolean(editingChannelId);
        const nextChannel = {
            id: editingChannelId || Date.now(),
            name: liveName.value.trim(),
            description: liveDescriptionInput.value.trim(),
            stream: liveStream.value.trim(),
            fallbackStream: liveFallback.value.trim(),
            program: liveProgram.value.trim() || '自由直播'
        };
        if (wasEditing) {
            liveChannels = liveChannels.map(channel => channel.id === editingChannelId ? nextChannel : channel);
        } else {
            liveChannels = [...liveChannels, nextChannel];
        }
        saveChannels();
        activeChannel = nextChannel;
        renderChannels();
        selectChannel(nextChannel);
        resetLiveForm();
        toggleManagePanel(false);
        setLiveStatus(wasEditing ? '直播已更新' : '直播已发布');
    });

    commentsList.addEventListener('click', event => {
        const deleteBtn = event.target.closest('.comment-delete-btn');
        if (!deleteBtn) return;
        const commentId = deleteBtn.dataset.commentId;
        deleteLiveComment(activeChannel.id, commentId);
    });

    commentForm.addEventListener('submit', event => {
        event.preventDefault();
        const authorInput = document.getElementById('commentAuthor');
        const textInput = document.getElementById('commentText');
        const comments = getComments();
        const channelComments = comments[activeChannel.id] || [];
        channelComments.push({
            id: `${Date.now()}-${Math.random().toString(16).slice(2, 8)}`,
            author: authorInput.value.trim(),
            text: textInput.value.trim(),
            time: new Date().toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit' })
        });
        comments[activeChannel.id] = channelComments;
        localStorage.setItem('liveComments', JSON.stringify(comments));
        commentForm.reset();
        renderComments();
    });

    ['loadedmetadata', 'durationchange', 'timeupdate', 'play', 'pause', 'waiting', 'playing'].forEach(eventName => {
        video.addEventListener(eventName, updateControlState);
    });

    window.addEventListener('load', () => {
        renderChannels();
        renderSchedule();
        setupPlayer();
        setVolume(localStorage.getItem('liveVolume') ?? 1);
        selectChannel(activeChannel);
        updateControlState();
        setupControlAutoHide();
    });
</script>
</body>
</html>
